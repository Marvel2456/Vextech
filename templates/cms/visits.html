{% extends 'base_admin.html' %}
{% block title %}Website Visits{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6">Website Visits Report</h2>

    <h3 class="text-xl font-semibold mb-4">Visit Counts by Source</h3>
    <table class="min-w-full mb-8">
        <thead>
            <tr>
                <th class="px-4 py-2 text-left">Source</th>
                <th class="px-4 py-2 text-left">Visits</th>
            </tr>
        </thead>
        <tbody>
            {% for src in sources %}
            <tr>
                <td class="px-4 py-2 capitalize">{{ src.source }}</td>
                <td class="px-4 py-2">{{ src.count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h3 class="text-xl font-semibold mb-4">Graph</h3>
    <canvas id="visitsChart" width="400" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('visitsChart').getContext('2d');
    const visitsChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: [{% for src in sources %}'{{ src.source|capfirst }}'{% if not forloop.last %}, {% endif %}{% endfor %}],
            datasets: [{
                label: 'Visit Count',
                data: [{% for src in sources %}{{ src.count }}{% if not forloop.last %}, {% endif %}{% endfor %}],
                backgroundColor: '#00A99D',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
{% endblock %}
