{% extends 'base_admin.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow mt-12 text-center">
    <h2 class="text-2xl font-bold mb-4 text-primary-dark">Password Reset Successful</h2>
    <p class="text-gray-700 mb-6">
        Your password has been set. You may now <a href="{% url 'login' %}" class="text-primary-teal hover:underline">log in</a> with your new password.
    </p>
    <a href="{% url 'login' %}" class="inline-block bg-primary-teal text-white px-6 py-2 rounded hover:bg-primary-dark transition">
        Go to Login
    </a>
</div>
{% endblock %}
