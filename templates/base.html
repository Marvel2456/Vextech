{% load static tailwind_tags %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title> Vextech| {% block title %} {% endblock title %} </title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="{% static 'images/VEXTPNG2DARK.png' %}" type="image/png">
        <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">

        <!-- Tailwind CSS -->
        {% tailwind_css %}

        <!-- Alpine.js Plugins -->
        <script defer src="https://unpkg.com/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
        <!-- Alpine.js Core -->
        <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script src="{% static 'js/htmx.min.js' %}" defer></script>
        
    </head>
    <body class="bg-background-light font-satoshi text-primary-dark overflow-x-hidden">
        
        <!-- Navbar -->
        {% include 'partials/navbar.html' %}

        {% block content %}

        {% endblock content %}

        <!-- Footer -->
        {% include 'partials/footer.html' %}
        {% include 'partials/whatsapp.html' %}
        
        {% block extra_js %}{% endblock extra_js %}
    </body>
</html>
